<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Smartphone Addiction Risk Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #f2ead9;          /* beige */
    --card: #fbf7ee;        /* warm off-white card */
    --text: #24301f;       /* deep forest text */
    --muted: #5c6b52;
    --border: #d8cdb2;
    --accent: #1b4332;      /* forest green */
    --accent-dark: #12332a;
    --low: #2f6b3a;
    --high: #a0522d;        /* warm sienna, reads clearly against green theme */
    --grad-1: rgba(27, 67, 50, 0.16);
    --grad-2: rgba(47, 107, 58, 0.14);
    --grad-3: rgba(160, 82, 45, 0.10);
    --grad-4: rgba(27, 67, 50, 0.12);
    --toggle-bg: #ffffff;
    --warm: #c8863c;
    --warm-glow: rgba(200, 134, 60, 0.25);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #16201a;
    --card: #1f2c23;
    --text: #ece6d6;
    --muted: #a9b39c;
    --border: #35473c;
    --accent: #4a9463;
    --accent-dark: #6bbf85;
    --low: #4a9463;
    --high: #d38b5c;
    --grad-1: rgba(74, 148, 99, 0.18);
    --grad-2: rgba(107, 191, 133, 0.12);
    --grad-3: rgba(211, 139, 92, 0.10);
    --grad-4: rgba(74, 148, 99, 0.14);
    --toggle-bg: #2a3a2f;
    --warm: #e0a868;
    --warm-glow: rgba(224, 168, 104, 0.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 48px 20px 80px;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, var(--grad-1) 0%, transparent 45%),
      radial-gradient(circle at 85% 0%, var(--grad-2) 0%, transparent 40%),
      radial-gradient(circle at 90% 85%, var(--grad-3) 0%, transparent 40%),
      radial-gradient(circle at 5% 90%, var(--grad-4) 0%, transparent 40%);
    background-attachment: fixed;
    background-size: cover;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  .wrap { max-width: 660px; margin: 0 auto; }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
  }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: 2rem;
    margin: 0 0 6px;
    color: var(--accent-dark);
    letter-spacing: -0.01em;
  }
  p.sub { color: var(--muted); margin-top: 0; font-size: 0.95rem; }
  .theme-toggle {
    flex-shrink: 0;
    margin-top: 0;
    width: auto;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--toggle-bg);
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 600;
  }
  .theme-toggle:hover:not(:disabled) { background: var(--border); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px;
    margin-top: 24px;
    box-shadow: 0 10px 32px rgba(160, 110, 60, 0.12), 0 2px 8px rgba(27, 67, 50, 0.08);
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
    body { padding: 28px 14px 60px; }
    .card { padding: 24px 20px; }
    h1 { font-size: 1.6rem; }
  }
  label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--muted); }
  input, select {
    width: 100%;
    padding: 10px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 1rem; /* 16px avoids iOS auto-zoom on focus */
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--warm);
    box-shadow: 0 0 0 3px var(--warm-glow);
  }
  button {
    margin-top: 18px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fbf7ee;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px var(--warm-glow);
  }
  button:disabled { opacity: 0.6; cursor: default; transform: none; box-shadow: none; }
  .badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    font-weight: 700;
    color: white;
  }
  .badge.low { background: var(--low); }
  .badge.high { background: var(--high); }
  .bar-track { background: var(--border); border-radius: 999px; height: 10px; margin-top: 14px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); transition: width 0.4s ease; }
  #error { color: var(--high); margin-top: 12px; font-size: 0.9rem; display: none; }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 28px; }
  footer a { color: var(--accent-dark); }
  #statsLine { display: block; margin-bottom: 6px; font-weight: 600; }

  /* Result popup */
  dialog#resultDialog {
    border: none;
    border-radius: 20px;
    padding: 0;
    max-width: 360px;
    width: 90%;
    background: var(--card);
    box-shadow: 0 16px 44px rgba(160, 110, 60, 0.20), 0 4px 14px rgba(18, 51, 42, 0.20);
  }
  dialog#resultDialog::backdrop {
    background: rgba(18, 51, 42, 0.45);
  }
  .popup-inner { padding: 30px 26px; text-align: center; }
  .popup-icon { font-size: 2.4rem; line-height: 1; margin-bottom: 8px; }
  .popup-heading {
    font-family: "Fraunces", Georgia, serif;
    font-size: 1.4rem;
    font-weight: 700;
    margin: 4px 0;
  }
  .popup-heading.low { color: var(--low); }
  .popup-heading.high { color: var(--high); }
  .popup-sub { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
  .popup-close {
    margin-top: 20px;
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fbf7ee;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .popup-close:hover { transform: translateY(-1px); box-shadow: 0 6px 16px var(--warm-glow); }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <div>
      <h1>Smartphone Addiction Risk Predictor</h1>
      <p class="sub">Pilot demo: enter daily habits to estimate addiction risk. Not a clinical diagnosis.</p>
    </div>
    <button type="button" class="theme-toggle" id="themeToggle">Dark mode</button>
  </div>

  <div class="card">
    <form id="form">
      <div class="grid">
        <div>
          <label for="age">Age</label>
          <input type="number" id="age" min="18" max="35" value="24" required />
        </div>
        <div>
          <label for="gender">Gender</label>
          <select id="gender">
            <option>Female</option>
            <option>Male</option>
            <option>Other</option>
          </select>
        </div>
        <div>
          <label for="daily_screen_time_hours">Daily screen time (hrs)</label>
          <input type="number" step="0.1" id="daily_screen_time_hours" min="3" max="12" value="8.2" required />
        </div>
        <div>
          <label for="social_media_hours">Social media (hrs)</label>
          <input type="number" step="0.1" id="social_media_hours" min="0.5" max="6" value="4.1" required />
        </div>
        <div>
          <label for="gaming_hours">Gaming (hrs)</label>
          <input type="number" step="0.1" id="gaming_hours" min="0" max="4" value="1.3" required />
        </div>
        <div>
          <label for="work_study_hours">Work/study (hrs)</label>
          <input type="number" step="0.1" id="work_study_hours" min="0.5" max="6" value="5.0" required />
        </div>
        <div>
          <label for="sleep_hours">Sleep (hrs)</label>
          <input type="number" step="0.1" id="sleep_hours" min="4.5" max="9" value="5.8" required />
        </div>
        <div>
          <label for="weekend_screen_time">Weekend screen time (hrs)</label>
          <input type="number" step="0.1" id="weekend_screen_time" min="3.6" max="14.9" value="9.0" required />
        </div>
        <div>
          <label for="notifications_per_day">Notifications / day</label>
          <input type="number" id="notifications_per_day" min="20" max="250" value="210" required />
        </div>
        <div>
          <label for="app_opens_per_day">App opens / day</label>
          <input type="number" id="app_opens_per_day" min="15" max="180" value="130" required />
        </div>
        <div>
          <label for="stress_level">Stress level</label>
          <select id="stress_level">
            <option>Low</option>
            <option>Medium</option>
            <option selected>High</option>
          </select>
        </div>
        <div>
          <label for="academic_work_impact">Academic/work impact?</label>
          <select id="academic_work_impact">
            <option>No</option>
            <option selected>Yes</option>
          </select>
        </div>
      </div>

      <button type="submit" id="submitBtn">Predict risk</button>
    </form>

    <div id="error"></div>
  </div>

  <footer>
    <span id="statsLine"></span>
    Model trained in scikit-learn &middot; served via FastAPI &middot; <a href="/docs">API docs</a>
  </footer>
</div>

<dialog id="resultDialog">
  <div class="popup-inner">
    <div class="popup-icon" id="popupIcon"></div>
    <div class="popup-heading" id="popupHeading"></div>
    <div class="popup-sub" id="popupSub"></div>
    <div class="bar-track"><div id="bar" class="bar-fill" style="width:0%"></div></div>
    <button class="popup-close" id="popupClose">Close</button>
  </div>
</dialog>

<script>
  const themeToggle = document.getElementById("themeToggle");

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    themeToggle.textContent = theme === "dark" ? "Light mode" : "Dark mode";
  }

  (function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) { /* private mode etc. */ }
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    applyTheme(saved || (prefersDark ? "dark" : "light"));
  })();

  themeToggle.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem("theme", next); } catch (e) { /* ignore */ }
  });

  const form = document.getElementById("form");
  const submitBtn = document.getElementById("submitBtn");
  const errorEl = document.getElementById("error");
  const resultDialog = document.getElementById("resultDialog");
  const popupIcon = document.getElementById("popupIcon");
  const popupHeading = document.getElementById("popupHeading");
  const popupSub = document.getElementById("popupSub");
  const bar = document.getElementById("bar");
  const popupClose = document.getElementById("popupClose");
  const statsLine = document.getElementById("statsLine");

  popupClose.addEventListener("click", () => resultDialog.close());

  async function refreshStats() {
    try {
      const res = await fetch("/stats");
      if (!res.ok) return;
      const data = await res.json();
      const n = data.predictions_since_restart;
      const v = data.unique_visitors_since_restart;
      statsLine.textContent =
        `${v} visitor${v === 1 ? "" : "s"}, ${n} prediction${n === 1 ? "" : "s"} since this server last restarted`;
    } catch (e) { /* stats are a nice-to-have, fail silently */ }
  }
  refreshStats();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "Predicting…";

    const payload = {
      age: Number(document.getElementById("age").value),
      gender: document.getElementById("gender").value,
      daily_screen_time_hours: Number(document.getElementById("daily_screen_time_hours").value),
      social_media_hours: Number(document.getElementById("social_media_hours").value),
      gaming_hours: Number(document.getElementById("gaming_hours").value),
      work_study_hours: Number(document.getElementById("work_study_hours").value),
      sleep_hours: Number(document.getElementById("sleep_hours").value),
      notifications_per_day: Number(document.getElementById("notifications_per_day").value),
      app_opens_per_day: Number(document.getElementById("app_opens_per_day").value),
      weekend_screen_time: Number(document.getElementById("weekend_screen_time").value),
      stress_level: document.getElementById("stress_level").value,
      academic_work_impact: document.getElementById("academic_work_impact").value,
    };

    try {
      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error(`API returned ${res.status}`);
      const data = await res.json();

      const pct = Math.round(data.probability_addicted * 100);
      popupIcon.textContent = data.addicted ? "⚠️" : "✅";
      popupHeading.textContent = data.addicted ? "You're at risk" : "You're not at risk";
      popupHeading.className = "popup-heading " + (data.addicted ? "high" : "low");
      popupSub.textContent = `${pct}% predicted probability of addiction risk`;
      bar.style.width = pct + "%";
      resultDialog.showModal();
      refreshStats();
    } catch (err) {
      errorEl.textContent = "Something went wrong reaching the API: " + err.message;
      errorEl.style.display = "block";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Predict risk";
    }
  });
</script>
</body>
</html>
